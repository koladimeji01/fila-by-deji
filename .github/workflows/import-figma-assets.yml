name: Import original Figma imagery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-figma-assets.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Download the original photographed caps from Figma
        run: bash download-assets.sh
      - name: Commit originals to this site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.jpg assets/ceremonial.jpg assets/classic.jpg assets/premium.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add original FÌLÀ by Deji Figma photographs"
            git push
          fi