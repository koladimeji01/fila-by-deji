name: FÌLÀ backend and static site checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'js/**'
      - 'scripts/**'
      - 'vercel.json'
      - 'package.json'
      - 'css/**'
      - '*.html'
      - 'assets/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'js/**'
      - 'scripts/**'
      - 'vercel.json'
      - 'package.json'
      - 'css/**'
      - '*.html'
      - 'assets/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Python API and site regression tests
        working-directory: backend
        run: python -m pytest -q
      - name: JavaScript syntax check
        run: |
          node --check js/app.js
          node --check js/admin.js
      - name: Verify static Vercel storefront build
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/admin.html
          test -f dist/js/admin.js
          test -f dist/css/style.css
          test -f dist/assets/hero.png
          test ! -e dist/backend
          test ! -e dist/.env
